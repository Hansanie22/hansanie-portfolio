server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: hansanie-portfolio-backend

  datasource:
    url: jdbc:h2:mem:portfoliodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# OpenAPI / Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Portfolio Custom Metadata
portfolio:
  candidate:
    name: "Kalatuwawage Hansanie Prabodha"
    title: "Full-Stack Systems Engineer | Native Mobile & Enterprise Java Architect"
    academicSummary: "BSc (Hons) Undergraduate | UK Level 4 & Level 5 Distinction Holder"
    location: "Padukka, Sri Lanka | Remote / Relocation | Open for Global Engineering Roles"
    github: "https://github.com/Hansanie22"
