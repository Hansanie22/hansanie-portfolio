services:
  # ─────────────────────────────────────────────────────────────
  # Portfolio Web Service (Spring Boot + React, Docker)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: hansanie-portfolio
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      # ── Optional: connect a Render PostgreSQL or external MySQL ──
      # Uncomment and set these if using a real database:
      # - key: SPRING_DATASOURCE_URL
      #   value: jdbc:postgresql://your-render-db-host:5432/portfolio
      # - key: SPRING_DATASOURCE_USERNAME
      #   fromDatabase:
      #     name: hansanie-portfolio-db
      #     property: user
      # - key: SPRING_DATASOURCE_PASSWORD
      #   fromDatabase:
      #     name: hansanie-portfolio-db
      #     property: password
      # - key: SPRING_JPA_DIALECT
      #   value: org.hibernate.dialect.PostgreSQLDialect
      # - key: SPRING_DATASOURCE_DRIVER
      #   value: org.postgresql.Driver

  # ─────────────────────────────────────────────────────────────
  # Optional: Render PostgreSQL Database (free tier, 90-day limit)
  # ─────────────────────────────────────────────────────────────
  # databases:
  #   - name: hansanie-portfolio-db
  #     plan: free
  #     region: singapore
  #     databaseName: portfoliodb
  #     user: portfoliouser
